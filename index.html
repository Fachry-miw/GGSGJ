<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGSGJ Portal</title>
    <!-- Import Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Hubungkan ke CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Background Layar -->
    <div class="bg-photo-overlay"></div>
    <canvas id="bg-canvas"></canvas>

    <!-- HALAMAN 1: LANDING PAGE -->
    <div id="page-index" class="page active">
        <div class="brand-container-large">
            <!-- Memanggil logo baru kamu -->
            <img src="58990.jpg" alt="GGSGJ Logo" class="brand-logo-large">
        </div>
        <h1 class="title-font index-title-main">GGSGJ</h1>
        <p class="subtitle-font index-subtitle-main">Forever until end of world</p>
        
        <!-- Tombol Let's Start -->
        <button id="start-btn" class="bubble-btn">Let's start</button>
    </div>

    <!-- HALAMAN 2: LOGIN PAGE -->
    <div id="page-login" class="page">
        <div class="login-card">
            <div class="brand-container-login">
                <img src="58990.jpg" alt="Logo" class="brand-logo-login">
                <h2 class="title-font">GGSGJ</h2>
            </div>
            <h1 class="login-heading">Welcome Back</h1>
            <p class="login-sub">Enter your credentials to continue</p>
            
            <div class="form-group">
                <label>USERNAME</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" placeholder="Masukkan username">
                </div>
            </div>
            <div class="form-group">
                <label>PASSWORD</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="password" placeholder="Masukkan password">
                </div>
            </div>
            <p id="login-error" class="error-text">Username atau password salah!</p>
            <button id="login-btn" class="solid-login-btn">Login</button>
        </div>
    </div>

    <!-- Notifikasi Bawah -->
    <div id="toast">Notifikasi GGSGJ</div>

    <!-- Hubungkan ke JavaScript -->
    <script src="app.js"></script>
</body>
</html>
